server {
    listen 80;
    listen [::]:80;
    server_name api.xn--b1aajkzgbw.xn--p1ai;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
